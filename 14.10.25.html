<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
    <link rel="stylesheet" href="14.10.25.css">
</head>
<body>
    <div class="cont">
        <div style="display: flex;align-items: center; flex-wrap:wrap;">
            <img src="logo.png" id="logo" style="width: 120px;height: 120px;margin-right: 10px;">
            <h2>Maths club registration form</h2>
        </div>
        
        <form id="studentForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="enrollment">Enrollment Number:</label>
            <input type="text" id="enrollment" name="enrollment" required>

            <label for="scholar">Scholar Number:</label>
            <input type="text" id="scholar" name="scholar" required>
        
            <label for="branch">Branch/Program:</label>
            <input type="text" id="branch" name="branch" required>
            <p>
                <label for="gender">Gender</label><br>
                <input type="radio" id="gender" name="gender" value="male">
                <label for="male">Male</label>
                <input style="margin-left: 50px;" type="radio" id="gender" name="gender" value="female">
                <label for="female">Female</label>
                <input style="margin-left: 50px;" type="radio" id="gender" name="secret" value="secret">
                <label for="Prefer not to say">Prefer not to say</label>
            </p>
            
            <label for="year">Year:</label>
            <input type="text" id="yr" name="year" required>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
